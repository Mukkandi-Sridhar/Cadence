name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: .

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint, typecheck, unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: semeval_test
          POSTGRES_USER: semeval
          POSTGRES_PASSWORD: semeval_test_secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://semeval:semeval_test_secret@localhost:5432/semeval_test
      REDIS_URL: redis://localhost:6379/0
      DISABLE_AUTH: "true"
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: semeval-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps (ffmpeg, libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 postgresql-client

      - name: Install Python dependencies
        working-directory: semeval/backend
        run: pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: semeval/backend
        run: ruff check semeval/ tests/

      - name: Ruff format check
        working-directory: semeval/backend
        run: ruff format --check semeval/ tests/

      - name: Run Alembic migrations
        working-directory: semeval/backend
        run: alembic upgrade head

      - name: Unit tests
        working-directory: semeval/backend
        run: pytest tests/unit/ -v --tb=short --cov=semeval --cov-report=term-missing

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: semeval/frontend/package-lock.json

      - name: Install dependencies
        working-directory: semeval/frontend
        run: npm ci

      - name: ESLint
        working-directory: semeval/frontend
        run: npm run lint

      - name: TypeScript typecheck
        working-directory: semeval/frontend
        run: npm run typecheck

      - name: Build
        working-directory: semeval/frontend
        run: npm run build
