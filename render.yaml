# Render Blueprint Configuration (https://render.com)
# Deploys Semeval: PostgreSQL (pgvector), Redis, FastAPI Backend, ARQ Worker, and React Frontend.

services:
  # ── 1. Backend Web Service (FastAPI) ──────────────────────────────────────
  - type: web
    name: semeval-backend
    env: python
    region: oregon
    plan: starter
    rootDir: semeval/backend
    buildCommand: pip install -e ".[dev]" && alembic upgrade head
    startCommand: uvicorn semeval.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DISABLE_AUTH
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: semeval-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: semeval-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # ── 2. ARQ Background Worker ──────────────────────────────────────────────
  - type: worker
    name: semeval-worker
    env: python
    region: oregon
    plan: starter
    rootDir: semeval/backend
    buildCommand: pip install -e ".[dev]"
    startCommand: python -m semeval.workers.worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DISABLE_AUTH
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: semeval-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: semeval-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false

  # ── 3. Frontend Web Service (React Vite Static Site) ──────────────────────
  - type: web
    name: semeval-frontend
    env: static
    region: oregon
    rootDir: semeval/frontend
    buildCommand: cd ../packages/shared-types && npm install && npm run build && cd ../../frontend && npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: semeval-backend
          property: url

databases:
  # ── 4. PostgreSQL 16 (with pgvector) ──────────────────────────────────────
  - name: semeval-db
    databaseName: semeval
    user: semeval
    region: oregon
    plan: starter

  # ── 5. Redis Instance ─────────────────────────────────────────────────────
  - type: redis
    name: semeval-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
