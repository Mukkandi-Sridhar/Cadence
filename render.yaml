# Render Blueprint Configuration (https://render.com)
#
# One Docker web service: FastAPI backend + the built React SPA served from
# the same origin (root Dockerfile, multi-stage build — see that file).
# Data lives in Supabase, not a Render-managed database, and there is no
# separate worker/Redis service — an earlier design (Postgres + Redis + an
# ARQ background worker) was scrapped in favor of this single synchronous
# pipeline to keep Render's starter-tier build fast and the moving parts to
# a minimum. If you're provisioning fresh from this file, you still need to
# fill in the `sync: false` secrets below in the Render dashboard yourself —
# they're deliberately not stored here or auto-generated.

services:
  - type: web
    name: cadence
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DISABLE_AUTH
        value: "false"
      # Single shared HTTP Basic Auth password gating the whole site (see
      # semeval/backend/semeval/api/auth.py) — there's no per-user login,
      # this is one shared tool for a college event's organizers/judges.
      - key: ACCESS_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
