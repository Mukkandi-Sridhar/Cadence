services:
  # ── Postgres 16 + pgvector ────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-semeval}
      POSTGRES_USER: ${POSTGRES_USER:-semeval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-semeval_dev_secret}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-semeval} -d ${POSTGRES_DB:-semeval}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-semeval_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-semeval_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO bucket initialiser (runs once, then exits)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-semeval_minio} ${MINIO_ROOT_PASSWORD:-semeval_minio_secret};
        mc mb --ignore-existing local/${MINIO_BUCKET:-semeval-audio};
        mc anonymous set none local/${MINIO_BUCKET:-semeval-audio};
        echo 'MinIO bucket ready.';
      "

  # ── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-semeval}:${POSTGRES_PASSWORD:-semeval_dev_secret}@db:5432/${POSTGRES_DB:-semeval}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-semeval_minio}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-semeval_minio_secret}
      STORAGE_BUCKET: ${MINIO_BUCKET:-semeval-audio}
      STORAGE_REGION: us-east-1
      DISABLE_AUTH: ${DISABLE_AUTH:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn semeval.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Background worker (ARQ) ───────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-semeval}:${POSTGRES_PASSWORD:-semeval_dev_secret}@db:5432/${POSTGRES_DB:-semeval}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-semeval_minio}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-semeval_minio_secret}
      STORAGE_BUCKET: ${MINIO_BUCKET:-semeval-audio}
      DISABLE_AUTH: ${DISABLE_AUTH:-true}
    volumes:
      - ./backend:/app
    command: python -m semeval.workers.worker

  # ── Frontend (dev) ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

volumes:
  pg_data:
  redis_data:
  minio_data:
