[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semeval"
version = "0.1.0"
description = "Multi-agent seminar evaluation platform"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "supabase>=2.30.0",

    # Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",

    # Schema validation (used directly by tests/unit/test_llm_client.py)
    "jsonschema>=4.22.0",

    # LLM clients
    "openai>=1.35.0",

    # Utilities
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "httpx>=0.27.0",  # test client
    "factory-boy>=3.3.0",
    "Faker>=25.9.1",
]

[tool.hatch.build.targets.wheel]
packages = ["semeval"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # type annotations (key for correctness)
    "S",   # bandit security
    "RUF", # ruff-specific
]
ignore = [
    "S101",    # assert allowed in tests
    "S311",    # random module OK for non-crypto use
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be called in argument
# defaults — that's how the framework recognizes them, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["semeval"]
omit = ["tests/*", "alembic/*"]
